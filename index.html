<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Reva Chen | Culture-led Marketing & Creative Strategy</title>
<meta name="description" content="Reva Chen — music and culture marketing strategist. Interactive bilingual resume for Spotify Marketing Manager, Taiwan.">
<meta property="og:title" content="Reva Chen | Culture-led Marketing & Creative Strategy">
<meta property="og:description" content="From niche to next: social-first growth, music industry experience and cross-market business development.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: editorial left-rail chapters on an asymmetric 12-col grid. Palette: Soft Modern — cool white, sky→violet→pink signal gradient, navy ink; data set in mono. */
:root{
  --paper:#F5F6FC; --card:#FFFFFF; --glass:rgba(255,255,255,.74); --ink:#141A33; --muted:#5B6180; --line:#DDE1F0;
  --accent:#5258DE; --accent-ink:#FFFFFF; --violet:#7C5CE6; --pink:#C24FA2; --sky:#6F98F2; --soft:#ECECFD; --warn:#9A5B00;
  --glow1:rgba(127,166,245,.30); --glow2:rgba(170,140,245,.26); --glow3:rgba(240,165,212,.22);
  --deep1:#4D5ADF; --deep2:#8460E6; --deep3:#C2569F;
  --shadow:0 12px 32px rgba(44,54,130,.09); --r:16px;
  --f-display:"Archivo","Noto Sans TC","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans TC","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono","Noto Sans TC",ui-monospace,Menlo,monospace;
  --nav-h:56px; --maxw:1240px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1222; --card:#171B30; --glass:rgba(20,24,44,.76); --ink:#ECEEFB; --muted:#A3A8C4; --line:#2A2F4A;
  --accent:#A0A7FF; --accent-ink:#0E1022; --violet:#B9A2FF; --pink:#F2A0D6; --sky:#9DBBFF; --soft:#20244A; --warn:#E0A64A;
  --glow1:rgba(90,120,230,.22); --glow2:rgba(140,100,230,.18); --glow3:rgba(220,110,180,.12);
  --deep1:#3E4AC4; --deep2:#6C4CC8; --deep3:#A3428A; --shadow:0 12px 32px rgba(0,0,0,.38); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1222; --card:#171B30; --glass:rgba(20,24,44,.76); --ink:#ECEEFB; --muted:#A3A8C4; --line:#2A2F4A;
  --accent:#A0A7FF; --accent-ink:#0E1022; --violet:#B9A2FF; --pink:#F2A0D6; --sky:#9DBBFF; --soft:#20244A; --warn:#E0A64A;
  --glow1:rgba(90,120,230,.22); --glow2:rgba(140,100,230,.18); --glow3:rgba(220,110,180,.12);
  --deep1:#3E4AC4; --deep2:#6C4CC8; --deep3:#A3428A; --shadow:0 12px 32px rgba(0,0,0,.38); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background-color:var(--paper);background-image:radial-gradient(60vw 46vw at 95% -8%,var(--glow2),transparent 62%),radial-gradient(52vw 40vw at -12% 18%,var(--glow1),transparent 62%),radial-gradient(44vw 40vw at 85% 70%,var(--glow3),transparent 62%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:8px 12px;z-index:100}
.skip:focus{left:16px}

/* NAV */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:16px;height:var(--nav-h)}
.brand{font-family:var(--f-display);font-weight:800;font-stretch:80%;letter-spacing:.02em;text-decoration:none;white-space:nowrap;font-size:15px}
.brand b{color:var(--accent)}
.chapters{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chapters::-webkit-scrollbar{display:none}
.chapters a{font-family:var(--f-mono);font-size:11.5px;text-decoration:none;padding:6px 8px;border-radius:3px;white-space:nowrap;color:var(--muted);letter-spacing:.02em}
.chapters a:hover{color:var(--ink)}
.chapters a[aria-current="true"]{color:var(--accent);background:var(--soft)}
.controls{display:flex;gap:8px;align-items:center;flex-shrink:0}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{font:600 12px/1 var(--f-mono);background:transparent;color:var(--ink);border:0;padding:8px 10px;cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button+button{border-left:1px solid var(--ink)}
@media (max-width:760px){.chapters{display:none}.brand{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.seg button{padding:8px 7px;font-size:11.5px}}
@media (max-width:480px){.brand .full{display:none}.brand .short{display:inline!important}.nav .wrap{gap:8px}.controls{gap:6px}.seg button{padding:8px 6px;font-size:11px}}
@media (max-width:900px){.portrait{max-width:360px}}

/* TYPE */
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow .n{color:var(--accent);font-weight:600}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2.chap{font-size:clamp(32px,4.4vw,58px);line-height:.98;font-weight:900;font-stretch:72%;letter-spacing:-.01em;text-transform:uppercase}
:lang(zh-TW) h2.chap{font-stretch:100%;letter-spacing:.01em;line-height:1.05}
h3{font-size:clamp(20px,2vw,26px);font-weight:800;font-stretch:88%;line-height:1.15}
p{margin:0}
.lede{font-size:clamp(17px,1.6vw,20px);line-height:1.55;max-width:46ch}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.small{font-size:13.5px;line-height:1.5}

/* CHAPTER FRAME */
.chapter{padding-block:clamp(28px,3.4vw,48px);border-bottom:1px solid var(--line);scroll-margin-top:var(--nav-h)}
.chead{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:24px;margin-bottom:clamp(16px,2vw,26px);align-items:end}
.chead .lede{max-width:none;font-size:clamp(15px,1.25vw,18px)}
.chead .eyebrow{align-self:start;padding-top:10px}
@media (max-width:760px){.chead{grid-template-columns:1fr;gap:12px}}
@media (max-width:560px){h2.chap{font-size:30px}:lang(zh-TW) h2.chap{font-size:25px;line-height:1.25}.feature-head h3{font-size:26px}:lang(zh-TW) .feature-head h3{font-size:23px}.sub-h h3{font-size:22px}.lede{font-size:16px}}

/* HERO */
.hero{padding-block:clamp(28px,4vw,56px) clamp(32px,4vw,48px);border-bottom:1px solid var(--line);scroll-margin-top:var(--nav-h)}
.hero-grid{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:clamp(24px,4vw,56px);align-items:center}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}}
.hero h1{font-size:clamp(40px,5.6vw,84px);line-height:.9;font-weight:900;font-stretch:62%;text-transform:uppercase;letter-spacing:-.015em}
.hero h1 .q,.next h2 em,.grad-text{background:linear-gradient(90deg,var(--accent),var(--violet) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
:lang(zh-TW) .hero h1{line-height:1.12;font-size:clamp(34px,4.6vw,68px)}
:lang(zh-TW) h1,:lang(zh-TW) h2,:lang(zh-TW) h3{word-break:keep-all;overflow-wrap:anywhere}
:lang(zh-TW) .proofchip .big span{display:inline-block}
.thesis{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px;margin-top:18px;font-size:14px}
.thesis .tag{font-family:var(--f-display);font-weight:800;font-stretch:118%;font-size:clamp(18px,2.2vw,28px);letter-spacing:.04em}
.thesis .tag i{font-style:normal;color:var(--violet)}
.hero .lede{margin-top:16px}
.portrait{position:relative;margin:0}
.portrait img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;object-position:50% 40%;border-radius:var(--r);box-shadow:var(--shadow)}
.portrait figcaption{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.portrait .who{position:absolute;left:12px;bottom:46px;background:linear-gradient(120deg,var(--deep1),var(--deep2));color:#fff;border-radius:10px;padding:10px 14px;font-family:var(--f-display);font-weight:800;line-height:1.15}
.portrait .who small{display:block;font:500 12px/1.4 var(--f-mono);opacity:.9}
.hero-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;margin-top:20px}
@media (max-width:700px){.hero-foot{grid-template-columns:1fr}}
.hero-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);margin-top:clamp(28px,4vw,48px)}
.hero-kpis div{padding:clamp(16px,2.4vw,26px);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.hero-kpis div:last-child{border-right:0}
.hero-kpis .v{font-family:var(--f-display);font-weight:900;font-stretch:72%;font-size:clamp(34px,5vw,64px);line-height:.95;font-variant-numeric:tabular-nums}
.hero-kpis div:nth-child(1) .v{color:var(--accent)} .hero-kpis div:nth-child(2) .v{color:var(--violet)} .hero-kpis div:nth-child(3) .v{color:var(--pink)} .hero-kpis div:nth-child(4) .v{color:var(--sky)}
.hero-kpis .v{font-size:clamp(30px,3.6vw,50px)!important}
@media (max-width:700px){.hero-kpis{grid-template-columns:1fr}.hero-kpis div{border-right:0;border-bottom:1px solid var(--line)}.hero-kpis div:last-child{border-bottom:0}}
.hero-kpis .v{white-space:nowrap}
:lang(zh-TW) .hero-kpis .v{font-size:clamp(26px,2.8vw,40px)!important}
@media (max-width:560px){.hero-kpis .v{font-size:24px!important}:lang(zh-TW) .hero-kpis .v{font-size:20px!important}}
.hero-kpis .l{font-weight:600;font-size:15px}
.hero-kpis .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);line-height:1.45}
@media (max-width:560px){.hero-kpis .v{font-size:26px;white-space:nowrap}.hero-kpis div{padding:14px 10px}.hero-kpis .l{font-size:13px}.hero-kpis .d{font-size:10.5px}}
.proofchip{max-width:640px}
.proofchip .big{font-family:var(--f-display);font-weight:900;font-stretch:70%;font-size:clamp(44px,6vw,76px);line-height:.9}
.proofchip .big span{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:10px;font:600 14px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:16px 20px;border-radius:12px;cursor:pointer;text-decoration:none;min-height:48px}
.btn:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* SIGNAL (equalizer motif) */
.signal{display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:28px}
.signal span{flex:1;background:var(--violet);border-radius:2px 2px 0 0;min-width:2px;transform-origin:bottom;animation:eq 2.8s ease-in-out infinite}

@keyframes eq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}

/* KEYWORDS */
.ticker{overflow:hidden;border-block:1px solid var(--line);background:var(--glass);margin-top:clamp(28px,4vw,48px)}
.ticker-track{display:flex;width:max-content;animation:tick 38s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker ul{display:flex;list-style:none;margin:0;padding:0}
.ticker li{font-family:var(--f-display);font-weight:800;font-stretch:110%;font-size:clamp(16px,2vw,22px);padding:12px 22px;letter-spacing:.06em;white-space:nowrap}
.ticker li::after{content:"／";color:var(--violet);padding-left:22px}
@keyframes tick{to{transform:translateX(-50%)}}

/* MINDSET */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--ink)}
.flow article{padding:24px 24px 28px 0;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.flow article+article{padding-left:24px}
.flow article:last-child{border-right:0}
.flow .verb{font-family:var(--f-display);font-weight:900;font-stretch:72%;font-size:clamp(32px,3.4vw,46px);line-height:.9}
.flow article:hover .verb{color:var(--accent)}
.flow .arrow{color:var(--accent)}
@media (max-width:760px){.flow{grid-template-columns:1fr}.flow article,.flow article+article{padding:20px 0;border-right:0;border-bottom:1px solid var(--line)}}
.disclaim{margin-top:20px;font-size:13.5px;color:var(--muted);max-width:70ch}

/* EXPERIENCE timeline */
.chain{display:flex;flex-wrap:wrap;gap:10px 8px;margin-bottom:24px;align-items:center}
.chain button{font:600 15px/1.2 var(--f-body);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:13px 18px;border-radius:999px;cursor:pointer;box-shadow:var(--shadow)}
.chain button:hover{border-color:var(--violet);color:var(--violet)}
.chain button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chain .sep{align-self:center;color:var(--violet);font-family:var(--f-mono);font-size:18px;font-weight:600}
.roles{display:grid;gap:0;border-top:1px solid var(--ink)}
.role{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:24px;padding:28px 0;border-bottom:1px solid var(--line);transition:opacity .25s}
.role.dim{opacity:.32}
.role .when{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.role .stages{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font:500 11px/1 var(--f-mono);padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.role ul{margin:12px 0 0;padding-left:18px;max-width:72ch}
.role li{margin-bottom:6px}
.role .co{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,2.4vw,28px);font-stretch:88%;line-height:1.1}
.role .title{font-weight:600;margin-top:4px}
@media (max-width:760px){.role{grid-template-columns:1fr;gap:8px}}
.tbc{display:inline-block;font:500 12px/1.4 var(--f-mono);border:1px dashed var(--warn);color:var(--warn);padding:2px 8px;border-radius:3px}
.note{border-left:3px solid var(--accent);padding:4px 0 4px 14px;font-size:14px;color:var(--muted);margin-top:12px;max-width:72ch}

/* WORK */
.feature{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.feature-head{padding:clamp(20px,3vw,40px);border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px;align-items:end}
@media (max-width:860px){.feature-head{grid-template-columns:1fr}}
.feature-head h3{font-size:clamp(28px,3.4vw,44px);font-stretch:68%;font-weight:900;text-transform:uppercase;line-height:.92}
:lang(zh-TW) .feature-head h3{font-stretch:100%;line-height:1.1}
.badge{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.badge.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:1px solid var(--line)}
.kpi{padding:20px clamp(14px,2vw,24px);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--f-display);font-weight:900;font-stretch:76%;font-size:clamp(26px,2.6vw,36px);line-height:1;font-variant-numeric:tabular-nums}
.kpi .v.acc{color:var(--accent)}
.kpi .l{font-weight:600;font-size:14px}
.kpi .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);line-height:1.45}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-bottom:1px solid var(--line)}.kpi:nth-child(2n){border-right:0}.kpi:last-child{grid-column:1/-1}}
.feature-body{padding:clamp(20px,3vw,36px);display:grid;gap:clamp(24px,3vw,40px)}
.feature-body>*,.feature-head>*,.layers>*,.windows>*,.facts>*,.speak>*,.why>*,.markets>*,.hosting>*,.proof>*,.case-body>*,.role>*,.edu>*,.pf-head>*,.hero-grid>*,.chead>*{min-width:0}
.panel-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.panel-title h4{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px;font-stretch:90%}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .lbl{fill:var(--ink);font-weight:600;font-size:13px}
.chart .halo{paint-order:stroke;stroke:var(--card);stroke-width:5px;stroke-linejoin:round}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--violet);stroke-width:2.5;fill:none}
.chart .ln.dash{stroke-dasharray:5 5}
.chart .pt{fill:var(--violet);stroke:var(--card);stroke-width:3}
.chart .pt.open{fill:var(--card);stroke:var(--pink);stroke-width:2.5}
.chart .band{fill:var(--soft)}
.chart .axis{stroke:var(--ink);stroke-width:1}
.scroll-x{overflow-x:auto}
.windows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.windows{grid-template-columns:1fr}}
.win{border:1px solid var(--line);border-radius:var(--r);padding:18px;background:var(--paper);display:flex;flex-direction:column;gap:14px}
.win.top{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.win .range{font-family:var(--f-mono);font-size:12.5px;font-weight:600}
.win dl{margin:0;display:grid;gap:10px}
.win dt{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.win dd{margin:0}
.bar{height:8px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--muted)}
.win.top .bar i{background:linear-gradient(90deg,var(--accent),var(--violet),var(--pink))}
.win .val{font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--ink)}
.win .ev{margin-top:auto}
.linkbtn{font:600 12.5px/1.2 var(--f-mono);background:none;border:0;color:var(--accent);padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}
.layers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:860px){.layers{grid-template-columns:1fr}}
.layer{border-top:2px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.layer .k{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600}
.discovery{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:640px){.discovery{grid-template-columns:1fr}}
.donut{width:150px;height:150px}
.donut .bg{stroke:var(--line)}
.donut .fg{stroke:var(--violet)}
.donut text{fill:var(--ink);font-family:var(--f-display);font-weight:900}

const LANGS = ["en","zh-TW"];
let lang = "en", mode = "experience", galleryFilter = "all", lbIndex = 0, lbList = [];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const t = () => T[lang];
const fmtN = n => n.toLocaleString("en-US");
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  if (!m) return String(y);
  if (lang === "zh-TW") return d ? `${y}/${String(m).padStart(2,"0")}/${String(d).padStart(2,"0")}` : `${y}/${String(m).padStart(2,"0")}`;
  return d ? `${MON[m-1]} ${d}, ${y}` : `${MON[m-1]} ${y}`;
}
function fmtRange(a,b){
  if (a === b) return fmtDate(a);
  const [y1,m1,d1] = a.split("-").map(Number), [y2,m2,d2] = b.split("-").map(Number);
  if (lang === "zh-TW") return `${y1}/${String(m1).padStart(2,"0")}/${String(d1).padStart(2,"0")}–${y2!==y1?y2+"/":""}${String(m2).padStart(2,"0")}/${String(d2).padStart(2,"0")}`;
  return y1 === y2 ? `${MON[m1-1]} ${d1} – ${MON[m2-1]} ${d2}, ${y2}` : `${MON[m1-1]} ${d1}, ${y1} – ${MON[m2-1]} ${d2}, ${y2}`;
}
function compact(n){
  if (lang === "zh-TW") return n >= 10000 ? (Math.round(n/1000)/10).toString() + " 萬" : fmtN(n);
  if (n >= 1e6) return (Math.round(n/1e4)/100).toString().replace(/\.?0+$/,"") + "M";
  if (n >= 1000) return Math.round(n/1000) + "K";
  return String(n);
}
const tbc = label => `<span class="tbc">${esc(label)}</span>`;
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2400); }
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

  const x = iso => L + (Date.parse(iso.length===7?iso+"-01":iso) - d0) / (d1 - d0) * (W - L - R);
  const y = v => Tp + (1 - v/12000) * (H - Tp - B);
  const ticks = [0,3000,6000,9000,12000];
  const months = ["2025-08","2025-09","2025-10","2025-11","2025-12","2026-01","2026-02"];
  const pts = MILESTONES.filter(p => !p.approx);
  const jan = MILESTONES.find(p => p.approx);
  const janX0 = x("2026-01-01"), janX1 = x("2026-02-01"), janMid = (janX0+janX1)/2;
  const path = pts.map((p,i) => `${i?"L":"M"}${x(p.date).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
  const last = pts[pts.length-1];
  const mLabel = iso => { const [yy,mm] = iso.split("-").map(Number); return lang==="zh-TW" ? `${yy}/${mm}` : `${MON[mm-1]}${mm===1||mm===8?" ’"+String(yy).slice(2):""}`; };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="fc-t fc-d">
    <title id="fc-t">${esc(c.growthTitle)}</title>
    <desc id="fc-d">${MILESTONES.map(p => `${fmtDate(p.date)}: ${p.approx?"≈":""}${fmtN(p.value)}`).join("; ")}</desc>
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W-R+60}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v===0?"0":(lang==="zh-TW"?fmtN(v):compact(v))}</text>`).join("")}
    <line class="axis" x1="${L}" x2="${W-R+60}" y1="${y(0)}" y2="${y(0)}"/>
    ${months.map(mo => `<line class="grid" x1="${x(mo)}" x2="${x(mo)}" y1="${y(0)}" y2="${y(0)+5}"/><text x="${x(mo)}" y="${H-B+20}" text-anchor="middle">${mLabel(mo)}</text>`).join("")}
    <rect class="band" x="${janX0}" y="${Tp}" width="${janX1-janX0}" height="${H-Tp-B}" fill="var(--soft)"/>
    <path class="ln" d="${path}"/>
    <path class="ln dash" d="M${x(last.date)},${y(last.value)} L${janMid},${y(jan.value)}"/>
    ${pts.map(p => { const px = x(p.date) - 12, py = y(p.value);
      return `<circle class="pt" cx="${x(p.date)}" cy="${py}" r="6"/>
      <text class="lbl halo" x="${px}" y="${py-24}" text-anchor="end">${fmtN(p.value)}</text>
      <text class="halo" x="${px}" y="${py-10}" text-anchor="end">${fmtDate(p.date)}</text>`; }).join("")}
    <line x1="${janX0+6}" x2="${janX1-6}" y1="${y(jan.value)}" y2="${y(jan.value)}" stroke="var(--accent)" stroke-width="3"/>
    <circle class="pt open" cx="${janMid}" cy="${y(jan.value)}" r="6"/>
    <text class="lbl" x="${janX1+8}" y="${y(jan.value)+4}">≈${fmtN(jan.value)}+</text>
    <text x="${janX1+8}" y="${y(jan.value)+19}">${fmtDate("2026-01")} · ${esc(t().approx)}</text>
  </svg>`;
}

      <h2 id="pf-${k}-h">${esc(P.sec[k])} <small>${esc(P.count(PF[k].length))}</small></h2>
      ${k==="grants" ? `<p class="small muted" style="margin-top:8px;max-width:80ch">${esc(P.grantNote)}</p>` : ""}
      <ul class="pf-list">${PF[k].map(x => `<li class="${HL.test(x[1][i])?"hl":""}"><span class="y">${esc(x[0])}</span><span class="w">${esc(x[1][i])}</span><span class="r">${esc(x[2][i])}</span></li>`).join("")}</ul>
    </section>`).join("")}
    <div class="actions" style="margin-top:40px"><button class="btn ghost" type="button" data-pfgo="pf-top">↑ ${esc(P.toTop)}</button><button class="btn" type="button" data-act="experience">← ${esc(P.back)}</button></div>
  </div>`;
}

/* =====================================================================
   8. RENDER — RECRUITER VIEW (also the print / PDF layout)
   ===================================================================== */
function renderRecruiter(){
  const r = t().recruiter, e = t().experience, mt = t().metric, n = t().next;
  const rowsM = [
    [mt.views+" (30 days)", fmtN(M("w3.views").value), fmtRange("2025-10-15","2025-11-13")+" · Instagram"],
    [mt.interactions, "≈"+fmtN(M("w3.interactions").value), fmtRange("2025-10-15","2025-11-13")],
    [mt.accountsReached, fmtN(M("w3.reached").value), fmtRange("2025-10-15","2025-11-13")],
    [mt.nonFollowerViewShare, M("w3.nonFollower").value.toFixed(1)+"%", fmtRange("2025-10-15","2025-11-13")],
    [mt.followersTotal, "262 → 2,079 → 8,004 → ≈11,000", `${fmtDate("2025-09-08")} → ${fmtDate("2026-01")}`],
    [lang==="zh-TW"?"Spotify 月聽眾（Lavi）":"Spotify monthly listeners (Lavi)", "47 → 1,713", lang==="zh-TW"?"2026・一週投放期間觀察":"2026 · one-week observation window during the Spotify campaign"],
    [lang==="zh-TW"?"《HHCC 喇街頭》第二季":"《HHCC 喇街頭》Season 2", lang==="zh-TW"?"24 集":"24 episodes", "EP25–48 · 2021"],
    [t().proof.fund.cat, t().proof.fund.hv, lang==="zh-TW"?"2019–2026 過審補助企劃":"Approved grant proposals, 2019–2026"],
    [t().proof.rev.cat, t().proof.rev.hv, lang==="zh-TW"?"2026/01–10・公司提供":"Jan–Oct 2026 · company-reported"]
  ];
  if (lang === "zh-TW") rowsM[0][0] = mt.views+"（30 天）";
  const cl = [`Email: ${esc(CONFIG.contact.email)}`, `${esc(n.keys.phone)}: ${esc(CONFIG.contact.phone)}`, `Instagram: ${ACCOUNT}`, esc(n.locationV)].join(`</span><span>`);
  return `<div class="wrap">
    <div class="rs-tools"><div><p style="font-weight:600">${esc(r.title)}</p><p class="small muted">${esc(r.hint)}</p></div>
      <div class="actions" style="margin:0"><button class="btn" type="button" data-act="pdf">${esc(n.pdf)} ↓</button><button class="btn ghost" type="button" data-act="experience">${esc(r.back)}</button></div></div>
    <article class="rs" aria-label="${esc(r.title)}">
      <h1>${esc(t().hook.name)}</h1>
      <p class="sub">${esc(t().hook.role)} · ${esc(t().hook.role2)}</p>
      <p class="small" style="margin-top:4px">${esc(t().hook.applying)}</p>
      <p class="contactline"><span>${cl}</span></p>
      <h2>${esc(r.summaryH)}</h2><p>${esc(r.summary)}</p>
      <h2>${esc(r.metricsH)}</h2>
      <table><thead><tr>${r.th.map(h => `<th scope="col">${esc(h)}</th>`).join("")}</tr></thead>
        <tbody>${rowsM.map(x => `<tr><td>${esc(x[0])}</td><td class="n">${esc(x[1])}</td><td class="small muted">${esc(x[2])}</td></tr>`).join("")}</tbody></table>
      <p class="small muted" style="margin-top:6px">${lang==="en" ? esc(r.igNote) : `${esc(t().work.c1.facts[1].h)}: ${esc(t().work.c1.facts[1].p)}`}</p>
      <h2>${esc(r.expH)}</h2>
      ${ROLES.map(ro => { const c = e.roles[ro.id];
        const when = ro.start==="TBC" ? (ro.end==="present" ? esc(e.present) : "") : `${fmtDate(ro.start)} – ${ro.end==="present"?esc(e.present):fmtDate(ro.end)}${ro.byProject?` (${esc(e.byProject)})`:""}`;
        return `<div class="job"><p class="jh"><span>${esc(c.co)} · ${esc(c.title)}</span><span>${when}</span></p>
          <ul>${(c.pts.length?c.pts:[c.sum]).map(p => `<li>${esc(p)}</li>`).join("")}${c.note?`<li>${esc(c.note)}</li>`:""}</ul></div>`; }).join("")}
      <h2>${esc(r.affH)}</h2><ul>${t().portfolio.pos.map(p => `<li>${esc(p[0])} — ${esc(p[1])}</li>`).join("")}</ul>
      <h2>${esc(r.projH)}</h2><ul>${r.projects.map(p => `<li>${esc(p)}</li>`).join("")}</ul><p class="small muted" style="margin-top:6px">${esc(r.pfLine)}</p>
      <h2>${esc(r.intlH)}</h2><ul>${r.intl.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
      <h2>${esc(r.speakH)}</h2><ul>${t().experience.speak.items.map(it => `<li>${esc(it.y)} · ${esc(it.org)} — ${esc(it.rl)}</li>`).join("")}<li>${t().experience.speak.host.map(h => `${esc(h[0])} ${esc(h[1])}`).join(lang==="zh-TW"?"；":"; ")}</li></ul>
      <h2>${esc(r.eduH)}</h2><div class="job"><p class="jh"><span>${esc(t().experience.edu.school)} · ${esc(t().experience.edu.degree)}</span><span>${EDUCATION.year}</span></p><ul><li>${esc(t().experience.edu.award)}</li></ul></div>
      <h2>${esc(r.skillsH)}</h2><div class="skills">${r.skills.map(s => `<span class="pill">${esc(s)}</span>`).join("")}</div>
    </article></div>`;
}

/* =====================================================================
   9. LIGHTBOX
   ===================================================================== */
function openLightbox(id){
  lbList = galleryFilter === "all" ? (galleryAll ? EVIDENCE : EVIDENCE.filter(e => KEY_EVIDENCE.includes(e.id))) : EVIDENCE.filter(e => e.group === galleryFilter);
  if (!lbList.find(e => e.id === id)) lbList = EVIDENCE.slice();
  lbIndex = lbList.findIndex(e => e.id === id);
  drawLightbox(); const d = $("#lightbox"); if (!d.open) { d.showModal(); }
}
function openCaseGallery(key){
  const [id,j] = key.split(":"), d = CASE_DATA[id], k = lang === "en" ? 1 : 2;
  lbList = d.gal.map(g => ({ src:`img/ev/${g[0]}.jpg`, title:g[k], caseTitle:d[lang==="en"?"en":"zh"].title }));
  lbIndex = +j; drawLightbox(); const dl = $("#lightbox"); if (!dl.open) dl.showModal();
}
function drawLightbox(){
  const e = lbList[lbIndex], g = t().gallery, mt = t().metric;
  if (e.src) {
    $("#lightbox").innerHTML = `<div class="lb-in"><div class="lb-img"><img src="${e.src}" alt="${esc(e.title)}"></div>
      <div class="lb-meta"><p class="eyebrow">${lbIndex+1} / ${lbList.length}</p><h3 id="lb-title">${esc(e.title)}</h3><p class="small muted">${esc(e.caseTitle)}</p>
      <div class="lb-nav"><button class="btn ghost" type="button" data-lb="prev">← ${esc(g.prev)}</button><button class="btn ghost" type="button" data-lb="next">${esc(g.next)} →</button><button class="btn" type="button" data-lb="close">${esc(g.close)}</button></div></div></div>`;
    $("#lightbox").querySelector('[data-lb="close"]').focus(); return;
  }
  $("#lightbox").innerHTML = `<div class="lb-in">
    <div class="lb-img"><img src="${imgSrc(e.id)}" alt="${esc(g.screen[e.screen])}, ${esc(fmtRange(e.start,e.end))}"></div>
    <div class="lb-meta">
      <p class="eyebrow">${lbIndex+1} / ${lbList.length}</p>
      <h3 id="lb-title">${esc(g.screen[e.screen])}</h3>
      <table><tbody>
        <tr><td>${esc(g.period)}</td><td>${esc(fmtRange(e.start,e.end))}</td></tr>
        <tr><td>${esc(g.platform)}</td><td>Instagram Insights</td></tr>
        <tr><td>${esc(g.account)}</td><td>${ACCOUNT}</td></tr>
      </tbody></table>
      <p class="eyebrow">${esc(g.values)}</p>
      <table><tbody>${e.values.map(v => `<tr><td>${esc(mt[v[0]]||v[0])}</td><td>${esc(v[1])}</td></tr>`).join("")}</tbody></table>
      ${e.group==="jan" ? `<p class="small muted">${esc(g.janNote)}</p>` : ""}
      <p class="small muted">${esc(g.lang)}</p>
      <div class="lb-nav">
        <button class="btn ghost" type="button" data-lb="prev">← ${esc(g.prev)}</button>
        <button class="btn ghost" type="button" data-lb="next">${esc(g.next)} →</button>
        <button class="btn" type="button" data-lb="close">${esc(g.close)}</button>
      </div>
    </div></div>`;
  $("#lightbox").querySelector('[data-lb="close"]').focus();
}
$("#lightbox").addEventListener("click", ev => {
  const b = ev.target.closest("[data-lb]");
  if (ev.target === ev.currentTarget) return $("#lightbox").close();
  if (!b) return;
  if (b.dataset.lb === "close") $("#lightbox").close();
  if (b.dataset.lb === "prev") { lbIndex = (lbIndex - 1 + lbList.length) % lbList.length; drawLightbox(); }
  if (b.dataset.lb === "next") { lbIndex = (lbIndex + 1) % lbList.length; drawLightbox(); }
});
$("#lightbox").addEventListener("keydown", ev => {
  if (ev.key === "ArrowLeft") { lbIndex = (lbIndex - 1 + lbList.length) % lbList.length; drawLightbox(); }
  if (ev.key === "ArrowRight") { lbIndex = (lbIndex + 1) % lbList.length; drawLightbox(); }
});

/* =====================================================================
   10. APP — language, mode, navigation, actions
   ===================================================================== */
const CHAPTERS = ["hook","mindset","experience","work","proof","borders","why","next"];
function renderAll(){
  const L = t();
  document.documentElement.lang = lang;
  document.title = L.meta.title;
  const setMeta = (sel, v) => { const m = document.querySelector(sel); if (m) m.setAttribute("content", v); };
  setMeta('meta[name="description"]', L.meta.desc); setMeta('meta[property="og:title"]', L.meta.title); setMeta('meta[property="og:description"]', L.meta.desc);
  $("#skip-link").textContent = L.skip;
  $("#mode-exp").textContent = L.modeExp; $("#mode-pf").textContent = L.modePf; $("#mode-rec").textContent = L.modeRec;
  $("#mode-exp").setAttribute("aria-pressed", mode === "experience"); $("#mode-pf").setAttribute("aria-pressed", mode === "portfolio"); $("#mode-rec").setAttribute("aria-pressed", mode === "recruiter");
  $("#lang-en").setAttribute("aria-pressed", lang === "en"); $("#lang-zh").setAttribute("aria-pressed", lang === "zh-TW");
  $("#chapter-nav").innerHTML = mode === "experience" ? CHAPTERS.map(c => `<a href="#${c}" data-go="${c}">${esc(L.nav[c])}</a>`).join("") : "";
  $("#experience-view").hidden = mode !== "experience";
  $("#recruiter").hidden = mode !== "recruiter";
  $("#portfolio").hidden = mode !== "portfolio";
  $("#portfolio").innerHTML = mode === "portfolio" ? renderPortfolio() : "";
  document.body.classList.toggle("recruiter", mode === "recruiter");
  if (mode === "experience") $("#experience-view").innerHTML = renderHook() + renderMindset() + renderExperience() + renderWork() + renderProof() + renderBorders() + renderWhy() + renderNext();
  else $("#experience-view").innerHTML = "";
  $("#recruiter").innerHTML = renderRecruiter();
  $("#footer").innerHTML = L.footer.map(f => `<span>${esc(f)}</span>`).join("");
  observeChapters();
}
function anchorState(){
  const top = (parseInt(getComputedStyle(document.documentElement).getPropertyValue("--nav-h")) || 56) + 4;
  for (const id of CHAPTERS) { const el = document.getElementById(id); if (!el) continue; const r = el.getBoundingClientRect();
    if (r.bottom > top) return { id, frac: Math.max(0, (top - r.top) / r.height) }; }
  return null;
}
function restoreAnchor(a){
  if (!a) return; const el = document.getElementById(a.id); if (!el) return;
  const top = (parseInt(getComputedStyle(document.documentElement).getPropertyValue("--nav-h")) || 56) + 4;
  window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY + a.frac * el.offsetHeight - top, behavior:"instant" });
}
function updateHash(){
  const h = (mode === "recruiter" ? "recruiter-" : mode === "portfolio" ? "portfolio-" : "") + lang;
  try { history.replaceState(null, "", location.pathname + location.search + "#" + h); } catch(e){}
}
function setLang(l){
  if (!LANGS.includes(l) || l === lang) return;
  const a = mode === "experience" ? anchorState() : null, y = window.scrollY;
  const openCases = [...document.querySelectorAll("details.case[open]")].map(d => d.id);
  lang = l; store.set("rc-lang", l); renderAll();
  openCases.forEach(id => { const d = document.getElementById(id); if (d) d.open = true; });
  if (a) restoreAnchor(a); else window.scrollTo({ top:y, behavior:"instant" });
  updateHash();
}
function setMode(m, target){
  if (m !== mode) { mode = m; store.set("rc-mode", m === "portfolio" ? "experience" : m); renderAll(); updateHash(); }
  const el = target && document.getElementById(target);
  if (el) { el.scrollIntoView({ block:"start", behavior:"instant" }); const h = el.querySelector("h2") || el; h.setAttribute("tabindex","-1"); h.focus({ preventScroll:true }); }
  else { window.scrollTo({ top:0, behavior:"instant" }); $("#main").focus({ preventScroll:true }); }
}
let io;
function observeChapters(){
  if (io) io.disconnect(); if (!("IntersectionObserver" in window)) return;
  io = new IntersectionObserver(entries => entries.forEach(en => { if (en.isIntersecting) {
    document.querySelectorAll("#chapter-nav a").forEach(a => a.setAttribute("aria-current", a.dataset.go === en.target.id)); } }),
    { rootMargin:"-45% 0px -50% 0px" });
  CHAPTERS.forEach(c => { const el = document.getElementById(c); if (el) io.observe(el); });
}
async function copyText(txt, okMsg){
  try { await navigator.clipboard.writeText(txt); toast(okMsg); } catch(e){ toast(t().next.copyFail); }
}
function downloadPDF(){
  const a = document.createElement("a"); a.href = CONFIG.pdf[lang];
  a.download = lang === "en" ? "Reva-Chen-Resume-EN.pdf" : "Reva-Chen-Resume-zh-TW.pdf";
  document.body.appendChild(a); a.click(); a.remove();
}
document.addEventListener("click", ev => {
  const go = ev.target.closest("[data-go]");
  if (go) { ev.preventDefault(); const el = document.getElementById(go.dataset.go); if (el) { const pd = el.closest("details"); if (pd) pd.open = true; el.scrollIntoView({ block:"start" }); const f = el.querySelector("h1,h2,h4"); if (f) { f.setAttribute("tabindex","-1"); f.focus({ preventScroll:true }); } } return; }
  const st = ev.target.closest("[data-stage]");
  if (st) { stageFilter = st.dataset.stage;
    document.querySelectorAll("[data-stage]").forEach(b => b.setAttribute("aria-pressed", b.dataset.stage === stageFilter));
    document.querySelectorAll(".role").forEach(r => r.classList.toggle("dim", stageFilter !== "all" && !r.dataset.stages.split(" ").includes(stageFilter))); return; }
  const gf = ev.target.closest("[data-gallery]");
  if (gf) { const grp = gf.dataset.gallery;
    if (grp === "all") { galleryFilter = "all"; $("#ig-more").open = true; document.getElementById("evidence").scrollIntoView({ block:"start" }); return; }
    galleryFilter = grp; const first = EVIDENCE.find(e => e.group === grp && e.screen === "views") || EVIDENCE.find(e => e.group === grp); openLightbox(first.id); galleryFilter = "all"; return; }
  const ga = ev.target.closest("[data-gallery-all]");
  if (ga) { galleryAll = !galleryAll; $("#gallery-slot").innerHTML = galleryHTML(); $("[data-gallery-all]").focus(); return; }
  const th = ev.target.closest("[data-ev]");
  if (th) { openLightbox(th.dataset.ev); return; }
  const cg = ev.target.closest("[data-cg]");
  if (cg) { openCaseGallery(cg.dataset.cg); return; }
  const cs = ev.target.closest("[data-case]");
  if (cs) { const d = document.getElementById(cs.dataset.case); if (d) { d.open = true; d.scrollIntoView({ block:"start" }); d.querySelector("summary").focus({ preventScroll:true }); } return; }
  const po = ev.target.closest("[data-portal]");
  if (po) { setMode("portfolio", po.dataset.portal); return; }
  const pg = ev.target.closest("[data-pfgo]");
  if (pg) { const el = document.getElementById(pg.dataset.pfgo); if (el) { el.scrollIntoView({ block:"start" }); const h = el.querySelector("h2") || el; h.setAttribute("tabindex","-1"); h.focus({ preventScroll:true }); } return; }
  const cp = ev.target.closest("[data-copy]");
  if (cp) { copyText(cp.dataset.copy, t().next.copied); return; }
  const act = ev.target.closest("[data-act]");
  if (act) { const a = act.dataset.act;
    if (a === "copy-email" && CONFIG.contact.email) copyText(CONFIG.contact.email, t().next.copied);
    if (a === "pdf") downloadPDF();
    if (a === "recruiter") setMode("recruiter");
    if (a === "experience") setMode("experience");
    if (a === "share") { updateHash(); copyText(location.href, t().next.linkCopied); }
  }
});
$("#lang-en").addEventListener("click", () => setLang("en"));
$("#lang-zh").addEventListener("click", () => setLang("zh-TW"));
$("#mode-exp").addEventListener("click", () => setMode("experience"));
$("#mode-pf").addEventListener("click", () => setMode("portfolio"));
$("#mode-rec").addEventListener("click", () => setMode("recruiter"));

/* Boot: URL (?lang= or #zh-TW / #recruiter-en) > saved preference > English */
(function boot(){
  let qLang = null, qMode = null;
  const p_mode = () => { try { const m = new URLSearchParams(location.search).get("mode"); return ["recruiter","portfolio"].includes(m) ? m : null; } catch(e){ return null; } };
  try { qLang = new URLSearchParams(location.search).get("lang"); } catch(e){}
  const h = (location.hash || "").replace("#","");
  const hm = h.match(/^(recruiter-|portfolio-)?(en|zh-TW)$/);
  if (hm) { qLang = qLang || hm[2]; if (hm[1]) qMode = hm[1].slice(0,-1); }
  if (p_mode()) qMode = qMode || p_mode();
  lang = LANGS.includes(qLang) ? qLang : (LANGS.includes(store.get("rc-lang")) ? store.get("rc-lang") : "en");
  mode = qMode || (store.get("rc-mode") === "recruiter" ? "recruiter" : "experience");
  renderAll();
})();
window.addEventListener("hashchange", () => {
  const hm = location.hash.replace("#","").match(/^(recruiter-|portfolio-)?(en|zh-TW)$/);
  if (hm) { if (hm[2] !== lang) setLang(hm[2]); const m = hm[1] ? hm[1].slice(0,-1) : "experience"; if (m !== mode) setMode(m); }
});
</script>
